<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado 💧</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; text-align: center; }
    a { display:inline-block; margin-top: 14px; }
  </style>
</head>
<body>
  <h1>Resultado</h1>
  {% if total is not none %}
    <h2>Seu consumo semanal estimado:</h2>
    <h1>{{ total }} litros de água 💦</h1>
    <h3>{{ mensagem }}</h3>
  {% else %}
    <p>{{ mensagem }}</p>
  {% endif %}
  <a href="/">🔁 Novo cálculo</a>
</body>
</html>
